<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Icon Studio</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app">
<header class="topbar"><div class="brand"><div class="brand-mark">IS</div><div><strong>Icon Studio</strong><span>vector workspace</span></div></div><div class="top-actions"><button class="ghost" id="newBtn">Novo</button><button class="ghost" id="openBtn">Importar SVG</button><input id="fileInput" type="file" accept=".svg,image/svg+xml" hidden><button class="icon-btn" id="undoBtn" title="Desfazer">↶</button><button class="icon-btn" id="redoBtn" title="Refazer">↷</button><button class="primary" id="exportSvg">SVG</button><button class="primary soft" id="exportPng">PNG</button></div></header>
<aside class="tools panel">
<button class="tool active" data-tool="select" title="Selecionar (V)">↖<span>Selecionar</span></button>
<button class="tool" data-tool="rect" title="Retângulo (R)">□<span>Retângulo</span></button>
<button class="tool" data-tool="ellipse" title="Elipse (E)">○<span>Elipse</span></button>
<button class="tool" data-tool="line" title="Linha (L)">╱<span>Linha</span></button>
<button class="tool" data-tool="freehand" title="Lápis (P)">✎<span>Lápis</span></button>
<button class="tool" data-tool="text" title="Texto (T)">T<span>Texto</span></button><button class="tool" data-tool="eyedropper" title="Conta-gotas (I)">◉<span>Conta-gotas</span></button>
<div class="shape-picker"><button class="tool shape-trigger" id="shapeTrigger" title="Mais formas"><span class="shape-main-icon" id="shapeIcon">△</span><span id="shapeLabel">Formas</span><b>›</b></button><div class="shape-popover" id="shapePopover"><div class="shape-popover-title">FORMAS</div><div class="shape-grid"><button data-shape="triangle">△<span>Triângulo</span></button><button data-shape="diamond">◇<span>Losango</span></button><button data-shape="pentagon">⬠<span>Pentágono</span></button><button data-shape="hexagon">⬡<span>Hexágono</span></button><button data-shape="star">☆<span>Estrela</span></button><button data-shape="heart">♡<span>Coração</span></button><button data-shape="arrow">➜<span>Seta</span></button><button data-shape="cross">＋<span>Cruz</span></button><button data-shape="ring">◎<span>Anel</span></button><button data-shape="polygon">⬢<span>Polígono</span></button></div></div></div>
<div class="separator"></div><button class="tool" id="duplicateBtn">⧉<span>Duplicar</span></button><button class="tool danger" id="deleteBtn">⌫<span>Excluir</span></button>
</aside>
<main class="workspace"><div class="workspace-bar"><div><span id="docName">Novo ícone</span><span class="saved" id="savedState">• salvo localmente</span></div><div class="view-controls"><label class="toggle"><input type="checkbox" id="gridToggle" checked> Grid</label><label class="toggle"><input type="checkbox" id="snapToggle" checked> Snap</label><div class="zoom"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">+</button><button id="zoomFit">Fit</button></div></div></div><div class="stage" id="stage"><svg id="canvas" viewBox="0 0 512 512" width="512" height="512" xmlns="http://www.w3.org/2000/svg"><defs><pattern id="checker" width="24" height="24" patternUnits="userSpaceOnUse"><rect width="24" height="24" fill="#e8ebef"/><rect width="12" height="12" fill="#cfd4da"/><rect x="12" y="12" width="12" height="12" fill="#cfd4da"/></pattern></defs><rect id="checkerboard" width="512" height="512" fill="url(#checker)"/><rect id="artboard" width="512" height="512" fill="none"/><g id="objects"></g><g id="selectionLayer"></g></svg></div><div class="statusbar"><span>512 × 512 px</span><span id="status">Selecionar</span><span id="coords">x 0 · y 0</span></div></main>
<aside class="properties panel">
<section><div class="section-title">Documento</div><label class="background-mode"><span>Fundo</span><button class="transparent-btn active" id="transparentBtn">▧ Transparente</button></label><label id="backgroundColorRow" class="disabled">Cor <div class="color-row"><input type="color" id="background" value="#ffffff"><input class="hex" id="backgroundHex" value="#FFFFFF"></div></label><label>Tamanho <select id="preset"><option value="512">512 × 512</option><option value="256">256 × 256</option><option value="1024">1024 × 1024</option></select></label></section>
<section><div class="section-title">Aparência</div><label>Preenchimento <div class="color-row"><button class="none-btn" id="fillNone">∅</button><input type="color" id="fill" value="#69a7ff"></div></label><label>Contorno <div class="color-row"><button class="none-btn" id="strokeNone">∅</button><input type="color" id="stroke" value="#172033"></div></label><label>Espessura <div class="field"><input type="range" id="strokeWidth" min="0" max="32" value="0"><output id="strokeValue">0</output></div></label><label>Opacidade <div class="field"><input type="range" id="opacity" min="0" max="100" value="100"><output id="opacityValue">100%</output></div></label><label>Esfumaçar <div class="field"><input type="range" id="blur" min="0" max="40" step="0.5" value="0"><output id="blurValue">0</output></div></label><label>Raio <div class="field"><input type="range" id="radius" min="0" max="100" value="18"><output id="radiusValue">18</output></div></label><label>Linha <select id="lineStyle"><option value="">Sólida</option><option value="12 8">Tracejada</option><option value="2 7">Pontilhada</option></select></label><label>Pontas <select id="lineCap"><option value="round">Redondas</option><option value="butt">Retas</option><option value="square">Quadradas</option></select></label><div class="row-actions"><button id="swapColors">⇄ Trocar fill / stroke</button></div><div class="section-subtitle">GRADIENTE</div><label>Modo <select id="fillMode"><option value="solid">Sólido</option><option value="linear">Linear</option></select></label><label id="gradientRow">Cor final <input type="color" id="gradientColor" value="#8b5cf6"></label><label>Ângulo <div class="field"><input type="range" id="gradientAngle" min="0" max="360" value="0"><output id="gradientAngleValue">0°</output></div></label></section><section id="shapeOptions"><div class="section-title">Forma</div><label>Lados <input class="small-input" type="number" id="polygonSides" value="6" min="3" max="24"></label></section><section id="textSection"><div class="section-title">Texto</div><label>Fonte <select id="fontFamily">
<optgroup label="Sans-serif">
<option value="Inter,Arial,sans-serif">Inter</option>
<option value="Arial,sans-serif">Arial</option>
<option value="'Arial Black',Arial,sans-serif">Arial Black</option>
<option value="'Arial Narrow',Arial,sans-serif">Arial Narrow</option>
<option value="Helvetica,Arial,sans-serif">Helvetica</option>
<option value="'Helvetica Neue',Helvetica,Arial,sans-serif">Helvetica Neue</option>
<option value="'Segoe UI',Arial,sans-serif">Segoe UI</option>
<option value="Verdana,Arial,sans-serif">Verdana</option>
<option value="Tahoma,Arial,sans-serif">Tahoma</option>
<option value="'Trebuchet MS',Arial,sans-serif">Trebuchet MS</option>
<option value="Calibri,Arial,sans-serif">Calibri</option>
<option value="Candara,Arial,sans-serif">Candara</option>
<option value="Corbel,Arial,sans-serif">Corbel</option>
<option value="'Century Gothic',Arial,sans-serif">Century Gothic</option>
<option value="Futura,Arial,sans-serif">Futura</option>
<option value="'Gill Sans',Arial,sans-serif">Gill Sans</option>
<option value="Optima,Arial,sans-serif">Optima</option>
<option value="'Franklin Gothic Medium',Arial,sans-serif">Franklin Gothic</option>
<option value="'Lucida Sans Unicode',Arial,sans-serif">Lucida Sans</option>
<option value="'Noto Sans',Arial,sans-serif">Noto Sans</option>
<option value="'DejaVu Sans',Arial,sans-serif">DejaVu Sans</option>
<option value="'Liberation Sans',Arial,sans-serif">Liberation Sans</option>
<option value="Roboto,Arial,sans-serif">Roboto</option>
<option value="'Open Sans',Arial,sans-serif">Open Sans</option>
<option value="Montserrat,Arial,sans-serif">Montserrat</option>
<option value="Poppins,Arial,sans-serif">Poppins</option>
<option value="Lato,Arial,sans-serif">Lato</option>
<option value="Ubuntu,Arial,sans-serif">Ubuntu</option>
<option value="Raleway,Arial,sans-serif">Raleway</option>
<option value="Oswald,Arial,sans-serif">Oswald</option>
<option value="'Source Sans 3',Arial,sans-serif">Source Sans 3</option>
</optgroup>
<optgroup label="Serif">
<option value="Georgia,serif">Georgia</option>
<option value="'Times New Roman',serif">Times New Roman</option>
<option value="Garamond,serif">Garamond</option>
<option value="'Palatino Linotype',Palatino,serif">Palatino</option>
<option value="Cambria,serif">Cambria</option>
<option value="Constantia,serif">Constantia</option>
<option value="'Book Antiqua',serif">Book Antiqua</option>
<option value="'Baskerville',serif">Baskerville</option>
<option value="'Century Schoolbook',serif">Century Schoolbook</option>
<option value="'Noto Serif',serif">Noto Serif</option>
<option value="'DejaVu Serif',serif">DejaVu Serif</option>
<option value="'Liberation Serif',serif">Liberation Serif</option>
<option value="'Roboto Slab',serif">Roboto Slab</option>
<option value="Merriweather,serif">Merriweather</option>
<option value="'Playfair Display',serif">Playfair Display</option>
</optgroup>
<optgroup label="Monospace / Técnica">
<option value="'Courier New',monospace">Courier New</option>
<option value="Consolas,monospace">Consolas</option>
<option value="'Lucida Console',monospace">Lucida Console</option>
<option value="Monaco,monospace">Monaco</option>
<option value="'DejaVu Sans Mono',monospace">DejaVu Sans Mono</option>
<option value="'Liberation Mono',monospace">Liberation Mono</option>
<option value="'Cascadia Code',monospace">Cascadia Code</option>
<option value="'Cascadia Mono',monospace">Cascadia Mono</option>
<option value="'JetBrains Mono',monospace">JetBrains Mono</option>
<option value="'Fira Code',monospace">Fira Code</option>
<option value="'Source Code Pro',monospace">Source Code Pro</option>
<option value="'IBM Plex Mono',monospace">IBM Plex Mono</option>
<option value="'Roboto Mono',monospace">Roboto Mono</option>
<option value="'Ubuntu Mono',monospace">Ubuntu Mono</option>
</optgroup>
<optgroup label="Display / Logo">
<option value="Impact,fantasy">Impact</option>
<option value="Haettenschweiler,Impact,fantasy">Haettenschweiler</option>
<option value="'Copperplate Gothic Bold',Copperplate,fantasy">Copperplate</option>
<option value="'Rockwell Extra Bold',Rockwell,serif">Rockwell</option>
<option value="'Bauhaus 93',fantasy">Bauhaus 93</option>
<option value="Broadway,fantasy">Broadway</option>
<option value="Stencil,fantasy">Stencil</option>
<option value="'Agency FB',sans-serif">Agency FB</option>
<option value="'Bank Gothic',sans-serif">Bank Gothic</option>
<option value="Eurostile,sans-serif">Eurostile</option>
<option value="Orbitron,sans-serif">Orbitron</option>
<option value="Audiowide,sans-serif">Audiowide</option>
<option value="Exo,Arial,sans-serif">Exo</option>
<option value="'Russo One',Arial,sans-serif">Russo One</option>
<option value="Anton,Impact,sans-serif">Anton</option>
<option value="Bebas,Impact,sans-serif">Bebas</option>
<option value="'Bebas Neue',Impact,sans-serif">Bebas Neue</option>
</optgroup>
<optgroup label="Manuscrita / Decorativa">
<option value="'Comic Sans MS',cursive">Comic Sans MS</option>
<option value="'Segoe Script',cursive">Segoe Script</option>
<option value="'Segoe Print',cursive">Segoe Print</option>
<option value="'Bradley Hand',cursive">Bradley Hand</option>
<option value="'Brush Script MT',cursive">Brush Script MT</option>
<option value="'Lucida Handwriting',cursive">Lucida Handwriting</option>
<option value="'Apple Chancery',cursive">Apple Chancery</option>
<option value="'URW Chancery L',cursive">URW Chancery</option>
<option value="'Dancing Script',cursive">Dancing Script</option>
<option value="Pacifico,cursive">Pacifico</option>
<option value="'Great Vibes',cursive">Great Vibes</option>
<option value="Lobster,cursive">Lobster</option>
</optgroup>
</select></label><label>Tamanho <input class="small-input" type="number" id="fontSize" value="72" min="4" max="500"></label><label>Peso <select id="fontWeight"><option value="400">Regular</option><option value="600">Semibold</option><option value="700" selected>Bold</option><option value="900">Black</option></select></label><div class="row-actions"><button id="editText">Editar texto</button></div></section>
<section><div class="section-title">Transformar</div><div class="grid2"><label>X<input type="number" id="posX"></label><label>Y<input type="number" id="posY"></label><label>W<input type="number" id="sizeW" min="1"></label><label>H<input type="number" id="sizeH" min="1"></label><label>Rotação<input type="number" id="rotation" value="0"></label></div><div class="row-actions"><button id="flipH">↔ Flip</button><button id="flipV">↕ Flip</button></div></section>
<section><div class="section-title">Organizar</div><div class="row-actions four"><button id="frontBtn" title="Trazer à frente">⇈</button><button id="upBtn" title="Subir">↑</button><button id="downBtn" title="Descer">↓</button><button id="backBtn" title="Enviar ao fundo">⇊</button></div><div class="row-actions"><button id="centerH">Centro H</button><button id="centerV">Centro V</button></div><div class="row-actions"><button id="alignLeft">← Esq.</button><button id="alignTop">↑ Topo</button><button id="alignRight">Dir. →</button><button id="alignBottom">Base ↓</button></div></section>
<section><div class="section-title">Edição</div><div class="row-actions"><button id="copyBtn">Copiar</button><button id="pasteBtn">Colar</button><button id="lockBtn">Bloquear</button></div></section><section class="layers-section"><div class="section-title">Camadas</div><div id="layers" class="layers"><div class="empty">Nenhum objeto</div></div></section>
</aside></div><div id="toast"></div><script src="app.js"></script></body></html>
